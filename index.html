<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোবাইল রিচার্জ - মিনি অ্যাপ</title>
    <!-- টেলিগ্রাম ওয়েব অ্যাপের অফিশিয়াল স্ক্রিপ্ট -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK স্ক্রিপ্ট -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>মোবাইল রিচার্জ</h2>
        <p>বিজ্ঞাপন দেখে রিচার্জ পয়েন্ট অর্জন করুন!</p>
        
        <!-- অ্যাড দেখার বাটন -->
        <button onclick="showAd()">বিজ্ঞাপন দেখুন (Watch Ad)</button>
        
        <div id="status"></div>
    </div>

    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশialize করা
        window.Telegram.WebApp.ready();

        // নতুন ব্লক আইডি int-43083 এখানে সেট করা হয়েছে
        const adController = window.Adsgram.init({ blockId: "int-43083" });

        function showAd() {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            adController.show()
                .then((result) => {
                    // ইউজার সফলভাবে বিজ্ঞাপন দেখা শেষ করলে
                    statusDiv.innerText = "ধন্যবাদ! আপনি সফলভাবে বিজ্ঞাপনটি দেখেছেন।";
                    console.log("Ad completed:", result);
                })
                .catch((result) => {
                    // ইউজার অ্যাড না দেখে কেটে দিলে বা সমস্যা হলে
                    statusDiv.innerText = "বিজ্ঞাপনটি সম্পন্ন হয়নি বা দেখা বাতিল করা হয়েছে।";
                    console.log("Ad error/cancelled:", result);
                });
        }
    </script>

</body>
</html>
