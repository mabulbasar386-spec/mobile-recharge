<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>মোবাইল রিচার্জ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .container { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
        button { background-color: #16a34a; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; }
        input, select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h2>মোবাইল রিচার্জ</h2>
        <input type="number" id="phoneNumber" placeholder="মোবাইল নম্বর" />
        <select id="operator"><option>GP</option><option>Robi</option></select>
        <select id="rechargePlan"><option value="30">৩০ পয়েন্ট</option><option value="50">৫০ পয়েন্ট</option></select>
        <button onclick="sendToBot()">রিচার্জ রিকোয়েস্ট পাঠান</button>
        <div id="status"></div>
    </div>

    <script>
        const BOT_TOKEN = "8041766840:AAEDaeZ3GA2Sd_VxYvBc17P8UeiaGd9IFeU";
        const ADMIN_ID = "2096812521"; // আপনার টেলিগ্রাম আইডি (যেখানে মেসেজ আসবে)

        function sendToBot() {
            let phone = document.getElementById("phoneNumber").value;
            let plan = document.getElementById("rechargePlan").value;
            let msg = `🔔 নতুন রিচার্জ রিকোয়েস্ট!\nনম্বর: ${phone}\nপরিমাণ: ${plan} পয়েন্ট`;
            
            let url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(msg)}`;

            fetch(url).then(() => {
                document.getElementById("status").innerText = "সফলভাবে পাঠানো হয়েছে!";
            });
        }
    </script>
</body>
</html>
