<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোবাইল রিচার্জ - মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; }
        .container { text-align: center; padding: 20px; background: #1e293b; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        .balance-box { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 15px; font-weight: bold; color: #38bdf8; }
        input, select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; box-sizing: border-box; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .recharge-btn { background-color: #16a34a; }
        .ref-btn { background-color: #d97706; }
        #status { margin-top: 10px; font-size: 14px; color: #facc15; }
        .ref-box { margin-top: 15px; background: #0f172a; padding: 8px; border-radius: 8px; font-size: 12px; color: #94a3b8; word-break: break-all; }
    </style>
</head>
<body>

    <div class="container">
        <h2>মোবাইল রিচার্জ</h2>
        <div class="balance-box">
            পয়েন্ট: <span id="balance">0</span> | অ্যাড: <span id="adCount">0</span>টি<br>
            রেফার: <span id="referCount">0</span> জন
        </div>
        <p style="font-size: 12px; color: #94a3b8;">নিয়ম: ২৫০ পয়েন্ট = ২০ টাকা | রেফার বোনাস: ২০ পয়েন্ট</p>
        
        <button onclick="showAd()">বিজ্ঞাপন দেখুন (Watch Ad)</button>

        <input type="number" id="phoneNumber" placeholder="আপনার মোবাইল নম্বর দিন (যেমন: 017xxxxxxxx)" />
        <select id="operator">
            <option value="GP">Grameenphone (GP)</option>
            <option value="Robi">Robi</option>
            <option value="Banglalink">Banglalink</option>
            <option value="Airtel">Airtel</option>
            <option value="Teletalk">Teletalk</option>
        </select>

        <button class="recharge-btn" onclick="openRecharge()">মোবাইল রিচার্জ করুন</button>
        <button class="ref-btn" onclick="shareReferral()">বন্ধুকে ইনভাইট করুন</button>
        
        <div class="ref-box">রেফার লিংক: <br><span id="refLink">লোড হচ্ছে...</span></div>
        <div id="status"></div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        let user = window.Telegram.WebApp.initDataUnsafe.user;
        let userId = user ? user.id : 'guest_' + Math.floor(Math.random() * 1000000);
        
        let balanceKey = 'user_balance_v6_' + userId;
        let adCountKey = 'user_adCount_v6_' + userId;
        let hourlyCountKey = 'user_hourly_count_v6_' + userId;
        let hourlyTimerKey = 'user_hourly_timer_v6_' + userId;
        let refKey = 'referral_bonus_claimed_' + userId;
        let referCountKey = 'user_refer_count_' + userId; // রেফার গণনার জন্য কি

        let balance = localStorage.getItem(balanceKey) ? parseInt(localStorage.getItem(balanceKey)) : 0;
        let adCount = localStorage.getItem(adCountKey) ? parseInt(localStorage.getItem(adCountKey)) : 0;
        let referCount = localStorage.getItem(referCountKey) ? parseInt(localStorage.getItem(referCountKey)) : 0;

        // নতুন ইউজারের জন্য রেফারেল বোনাস চেক
        function checkReferral() {
            let startParam = window.Telegram.WebApp.initDataUnsafe.start_param;
            if (startParam && startParam.startsWith('ref_') && !localStorage.getItem(refKey)) {
                balance += 20; // ২০ পয়েন্ট বোনাস
                localStorage.setItem(balanceKey, balance);
                localStorage.setItem(refKey, 'true');
                document.getElementById("status").innerText = "অভিনন্দন! রেফারেল থেকে ২০ পয়েন্ট বোনাস পেয়েছেন!";
            }
        }
        checkReferral();

        document.getElementById("balance").innerText = balance;
        document.getElementById("adCount").innerText = adCount;
        document.getElementById("referCount").innerText = referCount;

        let referralLink = `https://t.me/bd_mobile_recharge_bot?start=ref_${userId}`;
        document.getElementById("refLink").innerText = referralLink;

        const adController = window.Adsgram.init({ blockId: "int-43084" });

        function showAd() {
            const statusDiv = document.getElementById("status");
            let now = new Date().getTime();
            let hourlyTimer = localStorage.getItem(hourlyTimerKey) ? parseInt(localStorage.getItem(hourlyTimerKey)) : 0;
            let hourlyCount = localStorage.getItem(hourlyCountKey) ? parseInt(localStorage.getItem(hourlyCountKey)) : 0;

            if (now - hourlyTimer > 3600000) {
                hourlyCount = 0;
                localStorage.setItem(hourlyTimerKey, now);
            }

            if (hourlyCount >= 15) {
                let remainingMinutes = Math.ceil((3600000 - (now - hourlyTimer)) / 60000);
                statusDiv.innerText = `এই ঘণ্টায় আপনার ১৫টি অ্যাড দেখার সীমা শেষ! ${remainingMinutes} মিনিট পর আবার চেষ্টা করুন।`;
                return;
            }

            statusDiv.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            adController.show().then(() => {
                balance += 1; 
                adCount += 1;
                hourlyCount += 1;

                if (hourlyCount === 1 && !localStorage.getItem(hourlyTimerKey)) {
                    localStorage.setItem(hourlyTimerKey, now);
                }

                localStorage.setItem(balanceKey, balance);
                localStorage.setItem(adCountKey, adCount);
                localStorage.setItem(hourlyCountKey, hourlyCount);

                document.getElementById("balance").innerText = balance;
                document.getElementById("adCount").innerText = adCount;
                statusDiv.innerText = "অভিনন্দন! ১ পয়েন্ট যোগ হয়েছে।";
            }).catch(() => {
                statusDiv.innerText = "বিজ্ঞাপনটি দেখা সম্পন্ন হয়নি।";
            });
        }

        function openRecharge() {
            const phone = document.getElementById("phoneNumber").value;
            const operator = document.getElementById("operator").value;
            const statusDiv = document.getElementById("status");

            if (balance < 250) {
                statusDiv.innerText = "রিচার্জের জন্য কমপক্ষে ২৫০ পয়েন্ট প্রয়োজন!";
                return;
            }
            if (phone.length < 11) {
                statusDiv.innerText = "সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন!";
                return;
            }

            let message = `নতুন রিচার্জ রিকোয়েস্ট!\nইউজার আইডি: ${userId}\nনম্বর: ${phone}\nঅপারেটর: ${operator}\nপয়েন্ট খরচ: ${balance}`;
            let url = `https://t.me/Jou904?text=` + encodeURIComponent(message);
            
            window.Telegram.WebApp.openTelegramLink(url);

            balance = 0;
            localStorage.setItem(balanceKey, balance);
            document.getElementById("balance").innerText = balance;
            statusDiv.innerText = "আপনার রিচার্জ রিকোয়েস্ট পাঠানো হয়েছে!";
        }

        function shareReferral() {
            let shareUrl = `https://t.me/share/url?url=` + encodeURIComponent(referralLink) + `&text=বিনা পয়সায় মোবাইল রিচার্জ নিতে এই অ্যাপে জয়েন করুন!`;
            window.Telegram.WebApp.openTelegramLink(shareUrl);
            
            // কেউ লিংক শেয়ার করলে রেফার কাউન્ટ সাময়িকভাবে বাড়ানোর অপশন (বা রিয়েল সার্ভার থাকলে সেখানে আপডেট হবে)
            // নোট: এটি লোকাল কাউন্ট দেখানোর জন্য। ১০০% নিখুঁত রেফার কাউন্টের জন্য ব্যাকএন্ড ডাটাবেস প্রয়োজন হয়।
        }
    </script>
</body>
</html>
