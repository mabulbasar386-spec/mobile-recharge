<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোবাইল রিচার্জ - মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        .balance-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .recharge-btn {
            background-color: #16a34a;
        }
        .recharge-btn:hover {
            background-color: #15803d;
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #facc15;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>মোবাইল রিচার্জ</h2>
        
        <div class="balance-box">
            পয়েন্ট: <span id="balance">0</span> | দেখা অ্যাড: <span id="adCount">0</span>টি
        </div>

        <p>বিজ্ঞাপন দেখে পয়েন্ট অর্জন করুন!</p>
        
        <button onclick="showAd()">বিজ্ঞাপন দেখুন (Watch Ad)</button>

        <!-- মোবাইল নম্বর ও অপারেটর লেখার ঘর -->
        <input type="number" id="phoneNumber" placeholder="আপনার মোবাইল নম্বর দিন (যেমন: 017xxxxxxxx)" />
        
        <select id="operator">
            <option value="GP">Grameenphone (GP)</option>
            <option value="Robi">Robi</option>
            <option value="Banglalink">Banglalink</option>
            <option value="Airtel">Airtel</option>
            <option value="Teletalk">Teletalk</option>
        </select>

        <button class="recharge-btn" onclick="openRecharge()">মোবাইল রিচার্জ করুন</button>
        
        <div id="status"></div>
    </div>

    <script>
        window.Telegram.WebApp.ready();

        let balance = localStorage.getItem('user_balance') ? parseInt(localStorage.getItem('user_balance')) : 0;
        let adCount = localStorage.getItem('user_adCount') ? parseInt(localStorage.getItem('user_adCount')) : 0;

        document.getElementById("balance").innerText = balance;
        document.getElementById("adCount").innerText = adCount;

        const adController = window.Adsgram.init({ blockId: "int-43084" });

        function showAd() {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            adController.show()
                .then((result) => {
                    balance += 10;
                    adCount += 1;

                    localStorage.setItem('user_balance', balance);
                    localStorage.setItem('user_adCount', adCount);

                    document.getElementById("balance").innerText = balance;
                    document.getElementById("adCount").innerText = adCount;

                    statusDiv.innerText = "অভিনন্দন! আপনি ১০ পয়েন্ট পেয়েছেন।";
                })
                .catch((result) => {
                    statusDiv.innerText = "বিজ্ঞাপনটি সম্পন্ন হয়নি বা দেখা বাতিল করা হয়েছে।";
                });
        }

        function openRecharge() {
            const statusDiv = document.getElementById("status");
            const phone = document.getElementById("phoneNumber").value;
            const operator = document.getElementById("operator").value;

            if (balance < 100) {
                statusDiv.innerText = "রিচার্জ করতে কমপক্ষে ১০০ পয়েন্ট প্রয়োজন!";
                return;
            }

            if (phone.length < 11) {
                statusDiv.innerText = "দয়া করে সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন!";
                return;
            }

            // আপনার টেলিগ্রাম ইউজারনেমটি এখানে বসাবেন (যেমন: mabulbasar386 এর জায়গায় আপনার আসল ইউজারনেম দিন)
            let adminUsername = "mabulbasar386"; 
            let message = `নতুন রিচার্জ রিকোয়েস্ট!\nনম্বর: ${phone}\nঅপারেটর: ${operator}\nপয়েন্ট: 100`;
            
            let url = `https://t.me/${adminUsername}?text=` + encodeURIComponent(message);
            window.Telegram.WebApp.openTelegramLink(url);

            // সফলভাবে রিকোয়েস্ট পাঠানোর পর পয়েন্ট কেটে নেওয়া হবে
            balance -= 100;
            localStorage.setItem('user_balance', balance);
            document.getElementById("balance").innerText = balance;
            statusDiv.innerText = "আপনার রিচার্জ রিকোয়েস্ট পাঠানো হয়েছে!";
        }
    </script>

</body>
</html>
