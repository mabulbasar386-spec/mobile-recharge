<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোবাইল রিচার্জ - মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        .balance-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .recharge-btn { background-color: #16a34a; }
        .recharge-btn:hover { background-color: #15803d; }
        .ref-btn { background-color: #d97706; }
        .ref-btn:hover { background-color: #b45309; }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #facc15;
        }
        .ref-box {
            margin-top: 15px;
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>মোবাইল রিচার্জ</h2>
        
        <div class="balance-box">
            পয়েন্ট: <span id="balance">0</span> | দেখা অ্যাড: <span id="adCount">0</span>টি
        </div>

        <p>বিজ্ঞাপন দেখে পয়েন্ট অর্জন করুন!</p>
        <button onclick="showAd()">বিজ্ঞাপন দেখুন (Watch Ad)</button>

        <input type="number" id="phoneNumber" placeholder="আপনার নম্বর (যেমন: 017xxxxxxxx)" />
        
        <select id="operator">
            <option value="GP">Grameenphone (GP)</option>
            <option value="Robi">Robi</option>
            <option value="Banglalink">Banglalink</option>
            <option value="Airtel">Airtel</option>
            <option value="Teletalk">Teletalk</option>
        </select>

        <button class="recharge-btn" onclick="openRecharge()">মোবাইল রিচার্জ করুন</button>
        <button class="ref-btn" onclick="shareReferral()">বন্ধুকে ইনভাইট করুন (Share)</button>
        
        <div class="ref-box">আপনার রেফার লিংক: <br><span id="refLink">লোড হচ্ছে...</span></div>
        <div id="status"></div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let user = window.Telegram.WebApp.initDataUnsafe.user;
        let userId = user ? user.id : 'guest_' + Math.floor(Math.random() * 1000000);

        let balanceKey = 'user_balance_' + userId;
        let adCountKey = 'user_adCount_' + userId;

        let balance = localStorage.getItem(balanceKey) ? parseInt(localStorage.getItem(balanceKey)) : 100;
        let adCount = localStorage.getItem(adCountKey) ? parseInt(localStorage.getItem(adCountKey)) : 0;

        if (!localStorage.getItem(balanceKey)) {
            localStorage.setItem(balanceKey, balance);
        }

        document.getElementById("balance").innerText = balance;
        document.getElementById("adCount").innerText = adCount;

        // আপনার বটের ইউজারনেম এখানে দেওয়া আছে
        let botUsername = "my_recharge_x_bot"; 
        let referralLink = `https://t.me/${botUsername}?start=ref_${userId}`;
        document.getElementById("refLink").innerText = referralLink;

        let adController = window.Adsgram.init({ blockId: "int-43084" });

        function showAd() {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "বিজ্ঞাপন লোড হচ্ছে...";

            adController.show()
                .then((result) => {
                    balance += 10;
                    adCount += 1;
                    localStorage.setItem(balanceKey, balance);
                    localStorage.setItem(adCountKey, adCount);

                    document.getElementById("balance").innerText = balance;
                    document.getElementById("adCount").innerText = adCount;
                    statusDiv.innerText = "অভিনন্দন! আপনি ১০ পয়েন্ট পেয়েছেন।";
                })
                .catch((result) => {
                    statusDiv.innerText = "বিজ্ঞাপনটি দেখা সম্পন্ন হয়নি।";
                });
        }

        function openRecharge() {
            const statusDiv = document.getElementById("status");
            const phone = document.getElementById("phoneNumber").value.trim();
            const operator = document.getElementById("operator").value;

            if (balance < 100) {
                statusDiv.innerText = "রিচার্জ করতে কমপক্ষে ১০০ পয়েন্ট প্রয়োজন!";
                return;
            }

            if (!phone.startsWith("01") || phone.length !== 11) {
                statusDiv.innerText = "দয়া করে সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন!";
                return;
            }

            // মেসেজ ফরম্যাট যা সরাসরি আপনার বটের চ্যাটে চলে যাবে
            let message = `🔔 নতুন রিচার্জ রিকোয়েস্ট!\n\n👤 ইউজার আইডি: ${userId}\n📱 নম্বর: ${phone}\n⚡ অপারেটর: ${operator}\n💰 পয়েন্ট খরচ: 100`;
            
            let url = `https://t.me/${botUsername}?text=` + encodeURIComponent(message);
            window.Telegram.WebApp.openTelegramLink(url);

            balance -= 100;
            localStorage.setItem(balanceKey, balance);
            document.getElementById("balance").innerText = balance;
            document.getElementById("phoneNumber").value = "";
            statusDiv.innerText = "আপনার রিচার্জ রিকোয়েস্ট বটের মাধ্যমে পাঠানো হয়েছে!";
        }

        function shareReferral() {
            let shareUrl = `https://t.me/share/url?url=` + encodeURIComponent(referralLink) + `&text=` + encodeURIComponent("বিনা পয়সায় মোবাইল রিচার্জ নিতে এই অ্যাপে জয়েন করুন!");
            window.Telegram.WebApp.openTelegramLink(shareUrl);
        }
    </script>
</body>
</html>
